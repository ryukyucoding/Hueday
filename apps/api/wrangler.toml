name = "hueday-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[vars]
GEMINI_MODEL = "gemini-2.5-flash"

[[d1_databases]]
binding = "DB"
database_name = "hueday"
database_id = "REPLACE_ME"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "hueday-photos"

[[kv_namespaces]]
binding = "CACHE"
id = "REPLACE_ME"
